<style>
/* Layout: sticky quick-add bar on top, board filter chips, then columns side by side (scroll sideways on phones). */

  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }

  --bg: #1c1f22; --surface: #26292d; --col: #212427; --line: #363a3f;

.dayhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.trow .body { flex: 1; min-width: 0; display: grid; gap: 4px; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; }
.trow .t { font-weight: 500; overflow-wrap: anywhere; }

.trow .btn.sm { flex: none; }

.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.pill.planned { color: var(--accent); }
.ctop { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.card-del, .icon-del { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; color: var(--muted); cursor: pointer; border: 0; background: transparent; padding: 0; }
.card-del:hover, .icon-del:hover { color: var(--urgent); background: color-mix(in srgb, var(--urgent) 12%, transparent); }
.card-day { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; font-size: 12px; font-weight: 600; padding: 2px 9px; cursor: pointer; }

@media (hover: none) { .card-del { opacity: .7; } }

.cl-add { display: flex; gap: 6px; }

.state { padding: 40px 0; color: var(--muted); text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }

<script>
const DEFAULT_CONFIG = {
  boards: [
    { id: "life", name: "Life", color: "#3d7a5f" },
    { id: "idlvr", name: "iDlvr", color: "#c0612b" },
    { id: "rockbuild", name: "Rockbuild", color: "#4a62b0" }
  ],
  columns: [
    { id: "inbox", name: "Inbox" },
    { id: "next", name: "Up next" },
    { id: "doing", name: "Doing" },
    { id: "done", name: "Done" }
  ]
};
const QUADS = [
  { id: "ui", name: "Do first", sub: "Urgent and important", u: true, i: true },
  { id: "in", name: "Schedule", sub: "Important, not urgent", u: false, i: true },
  { id: "un", name: "Delegate", sub: "Urgent, not important", u: true, i: false },
  { id: "nn", name: "Drop or later", sub: "Not urgent, not important", u: false, i: false }
];
let db = null, config = DEFAULT_CONFIG, cards = [], filter = "all", view = "today", readOnly = false, loaded = false;
try { filter = localStorage.getItem("kb.filter") || "all"; view = localStorage.getItem("kb.view") || "today"; } catch (e) {}
let selDay = (() => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); })();
let pickOpen = false;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "board";

function toast(msg, action) {
  const t = $("#toast"); t.textContent = msg;
  if (action) { const b = document.createElement("button"); b.type = "button"; b.className = "toast-act"; b.textContent = action.label; b.onclick = () => { t.hidden = true; action.fn(); }; t.append(" ", b); }
  t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, action ? 6000 : 2600);
}
const TRASH = `<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>`;
// Deletes straight away and offers Undo, so there is no confirm step to tap through.
async function deleteTasks(ids) {
  const gone = cards.filter(c => ids.includes(c.id)); if (!gone.length || readOnly) return;
  cards = cards.filter(c => !ids.includes(c.id)); render();
  toast(gone.length === 1 ? "Task deleted" : `${gone.length} tasks deleted`, { label: "Undo", fn: async () => { cards.push(...gone); render(); for (const c of gone) await saveCard(c); toast("Restored"); } });
  try { for (const c of gone) await db?.collection("cards").doc(c.id).delete(); } catch (e) { toast("Couldn't delete. Try again."); }
}
function boardOf(id) { return config.boards.find(b => b.id === id) || { id, name: id, color: "#888" }; }
function iso(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
const todayIso = () => iso(new Date());
const fmtDay = (s, opts) => new Date(s + "T00:00:00").toLocaleDateString(undefined, opts);
function addDays(s, n) { const d = new Date(s + "T00:00:00"); d.setDate(d.getDate() + n); return iso(d); }
async function saveCard(c) { const { id, ...data } = c; await save(id, data); }
const REPEATS = [{ id: "", name: "Never" }, { id: "daily", name: "Daily" }, { id: "weekdays", name: "Weekdays" }, { id: "weekly", name: "Weekly" }, { id: "monthly", name: "Monthly" }];
const repeatName = r => REPEATS.find(x => x.id === r)?.name || "";
// Next date for a repeating task, always after today so finishing a late one doesn't spawn another late one.
function nextDate(day, rule) {
  const anchor = new Date(day + "T00:00:00").getDate();
  const step = d => {
    const x = new Date(d + "T00:00:00");
    if (rule === "daily") x.setDate(x.getDate() + 1);
    else if (rule === "weekdays") { do x.setDate(x.getDate() + 1); while (x.getDay() === 0 || x.getDay() === 6); }
    else if (rule === "weekly") x.setDate(x.getDate() + 7);
    else if (rule === "monthly") { const dd = anchor; x.setDate(1); x.setMonth(x.getMonth() + 1); x.setDate(Math.min(dd, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); }
    return iso(x);
  };
  let n = step(day), guard = 0; const t = todayIso();
  while (n <= t && guard++ < 400) n = step(n);
  return n;
}
// Like Google Tasks: ticking off a repeating task creates its next copy.
async function spawnNext(c) {
  if (!c.repeat || c.repeatSpawned) return;
  const base = c.day || todayIso(), day = nextDate(base, c.repeat);
  const shift = Math.round((new Date(day + "T00:00:00") - new Date(base + "T00:00:00")) / 864e5);
  const { id, doneAt, prevCol, repeatSpawned, ...rest } = c;
  const n = { ...rest, id: "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), day, col: prevCol && prevCol !== "done" ? prevCol : (config.columns.find(x => x.id === "next") || config.columns[0]).id, due: c.due ? addDays(c.due, shift) : null, checklist: (c.checklist || []).map(i => ({ t: i.t, done: false })), created: new Date().toISOString() };
  c.repeatSpawned = true;
  cards.push(n); render();
  toast(`Repeats: next one added for ${fmtDay(day, { weekday: "short", day: "numeric", month: "short" })}`);
  await saveCard(c); await saveCard(n);
}
function newPreset(extra) { return { board: filter !== "all" ? filter : config.boards[0]?.id, col: (config.columns.find(x => x.id === "next") || config.columns[0]).id, ...extra }; }

// Quick-add parser: "#board", "!" for urgent, and today/tomorrow/weekday/dd-mm for due date.
function parseQuick(text) {
  let board = filter !== "all" ? filter : config.boards[0]?.id, urgent = false, important = false, due = null;
  const days = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
  const words = text.trim().split(/\s+/).filter(w => {
    const lw = w.toLowerCase();
    if (lw.startsWith("#") && lw.length > 1) {
      const key = lw.slice(1);
      const b = config.boards.find(b => b.id === key || slug(b.name) === key || b.name.toLowerCase().startsWith(key));
      if (b) { board = b.id; return false; }
      return true;
    }
    if (/^[!*]+$/.test(lw)) { if (lw.includes("!")) urgent = true; if (lw.includes("*")) important = true; return false; }
    if (lw === "!urgent") { urgent = true; return false; }
    if (lw === "*important") { important = true; return false; }
    while (/^[!*]/.test(w) && w.length > 1) { if (w[0] === "!") urgent = true; else important = true; w = w.slice(1); }
    const lw2 = w.toLowerCase();
    const now = new Date(); now.setHours(0, 0, 0, 0);
    if (lw2 === "today" || lw2 === "tod") { due = iso(now); return false; }
    if (lw2 === "tomorrow" || lw2 === "tmr") { now.setDate(now.getDate() + 1); due = iso(now); return false; }
    const di = days.indexOf(lw2.slice(0, 3));
    if (di >= 0 && /^(sun|mon|tue|wed|thu|fri|sat)[a-z]*$/.test(lw2) && lw2.length <= 9) {
      let add = (di - now.getDay() + 7) % 7 || 7; now.setDate(now.getDate() + add); due = iso(now); return false;
    }
    const m = lw2.match(/^(\d{1,2})[\/.](\d{1,2})$/);
    if (m) { const d = new Date(now.getFullYear(), +m[2] - 1, +m[1]); if (d < now) d.setFullYear(d.getFullYear() + 1); due = iso(d); return false; }
    return true;
  });
  return { title: words.join(" "), board, urgent, important, due };
}

function dueInfo(due) {
  if (!due) return null;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const d = new Date(due + "T00:00:00"); const diff = Math.round((d - today) / 864e5);
  const label = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : diff === -1 ? "Yesterday" : d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  return { label, cls: diff < 0 ? "overdue" : diff <= 1 ? "soon" : "" };
}

function renderChips() {
  const counts = {}; cards.forEach(c => { if (c.col !== "done") counts[c.board] = (counts[c.board] || 0) + 1; });
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  let h = `<span class="seg view"><button class="chip" data-v="today" aria-pressed="${view === "today"}">My day</button><button class="chip" data-v="kanban" aria-pressed="${view === "kanban"}">Kanban</button><button class="chip" data-v="matrix" aria-pressed="${view === "matrix"}">Urgent / Important</button></span><span class="sep"></span>`;
  h += `<button class="chip" data-f="all" aria-pressed="${filter === "all"}">All <span class="n">${total}</span></button>`;
  for (const b of config.boards) h += `<button class="chip" data-f="${esc(b.id)}" aria-pressed="${filter === b.id}"><span class="dot" style="background:${esc(b.color)}"></span>${esc(b.name)} <span class="n">${counts[b.id] || 0}</span></button>`;
  if (!readOnly) h += `<button class="chip ghost" id="editBoards">Edit boards</button>`;
  $("#chips").innerHTML = h;
}

function render() {
  renderChips();
  const shown = cards.filter(c => filter === "all" || c.board === filter);
  const board = $("#board");
  if (loaded) { board.hidden = view === "today"; $("#today").hidden = view !== "today"; }
  if (view === "today") return renderToday(shown);
  board.classList.toggle("matrix", view === "matrix");
  if (view === "matrix") {
    const open = shown.filter(c => c.col !== "done");
    board.innerHTML = QUADS.map(q => {
      const list = open.filter(c => !!c.urgent === q.u && !!c.important === q.i).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
      return `<section class="column quad q-${q.id}" data-q="${q.id}">
        <div class="colhead"><div><h2>${q.name}</h2><div class="qsub">${q.sub}</div></div><span class="n">${list.length}</span></div>
        ${list.map(cardHTML).join("") || `<div class="empty">Drag cards here</div>`}
      </section>`;
    }).join("");
    return;
  }
  board.innerHTML = config.columns.map(col => {
    const list = shown.filter(c => c.col === col.id).sort((a, b) => (a.order ?? 0) - (b.order ?? 0));
    return `<section class="column ${col.id === "done" ? "done" : ""}" data-col="${esc(col.id)}">
      <div class="colhead"><h2>${esc(col.name)}</h2><span class="colr">${col.id === "done" && list.length && !readOnly ? `<button class="btn sm" type="button" data-cleardone title="Delete every task in Done">Clear all</button>` : ""}<span class="n">${list.length}</span>${readOnly ? "" : `<button class="coladd" type="button" data-newcol="${esc(col.id)}" aria-label="Add a task to ${esc(col.name)}">+</button>`}</span></div>
      ${list.map(cardHTML).join("") || `<div class="empty">${col.id === config.columns[0].id ? "Nothing here. Type above to add a card." : "Drag cards here"}</div>`}
    </section>`;
  }).join("");
  // Cards whose column was removed land in the first column visually
  const orphan = shown.filter(c => !config.columns.some(col => col.id === c.col));
  if (orphan.length) board.querySelector(".column").insertAdjacentHTML("beforeend", orphan.map(cardHTML).join(""));
}

function clCount(c) {
  return c.checklist?.length ? `<span class="cl-count ${c.checklist.every(i => i.done) ? "all" : ""}" title="Checklist">☑ ${c.checklist.filter(i => i.done).length}/${c.checklist.length}</span>` : "";
}

function rowHTML(c, action) {
  const b = boardOf(c.board), d = dueInfo(c.due), done = c.col === "done";
  return `<div class="trow ${done ? "done" : ""}">
    <input type="checkbox" data-done="${esc(c.id)}" ${done ? "checked" : ""} ${readOnly ? "disabled" : ""} aria-label="Mark ${esc(c.title)} done">
    <button class="body" type="button" data-open="${esc(c.id)}"><span class="t">${esc(c.title)}</span>
      <span class="meta"><span class="tag"><span class="dot" style="background:${esc(b.color)}"></span>${esc(b.name)}</span>
      ${c.time ? `<span class="pill time">${esc(c.time)}${c.endTime ? "–" + esc(c.endTime) : ""}</span>` : ""}${c.urgent ? `<span class="pill urgent">Urgent</span>` : ""}${c.important ? `<span class="pill important">Important</span>` : ""}
      ${d && !done ? `<span class="pill ${d.cls}">Due ${esc(d.label.toLowerCase() === d.label ? d.label : d.label)}</span>` : ""}
      ${c.repeat ? `<span class="tag">↻ ${repeatName(c.repeat)}</span>` : ""}${clCount(c)}${c.note ? `<span class="note-ic" title="Has notes">≡</span>` : ""}</span></button>
    ${action && !readOnly ? action : ""}${readOnly ? "" : `<button class="icon-del" type="button" data-del="${esc(c.id)}" aria-label="Delete ${esc(c.title)}" title="Delete">${TRASH}</button>`}
  </div>`;
}

function planOn(c, day) { c.day = day; c.dayOrder = Math.max(0, ...cards.filter(x => x.day === day && x !== c).map(x => x.dayOrder ?? 0)) + 1; }

// My day: a Google Tasks style list for one date. Cards join a day through their "day" field.
function renderToday(shown) {
  const t = todayIso();
  const start = addDays(selDay, -((new Date(selDay + "T00:00:00").getDay() + 6) % 7));
  const days = [...Array(7)].map((_, i) => addDays(start, i));
  const count = d => shown.filter(c => c.day === d && c.col !== "done").length;
  const open = shown.filter(c => c.col !== "done");
  const planned = shown.filter(c => c.day === selDay).sort((a, b) => (a.col === "done") - (b.col === "done") || (a.time || "99").localeCompare(b.time || "99") || (a.dayOrder ?? 0) - (b.dayOrder ?? 0));
  const carried = selDay === t ? open.filter(c => c.day && c.day < t) : [];
  const dueHere = open.filter(c => c.due === selDay && c.day !== selDay && !carried.includes(c));
  const others = open.filter(c => c.day !== selDay && !carried.includes(c) && !dueHere.includes(c)).sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999") || (a.order ?? 0) - (b.order ?? 0));
  const left = planned.filter(c => c.col !== "done").length;
  const add = c => `<button class="btn sm" type="button" data-plan="${esc(c.id)}">+ Add</button>`;
  const title = selDay === t ? "Today" : selDay === addDays(t, 1) ? "Tomorrow" : selDay === addDays(t, -1) ? "Yesterday" : fmtDay(selDay, { weekday: "long" });
  const prevIn = $("#dayAddIn"), keepFocus = !!prevIn && document.activeElement === prevIn, keepVal = prevIn?.value || "";
  $("#today").innerHTML = `
    <div class="week">
      <button class="btn nav" type="button" data-week="-7" aria-label="Previous week">‹</button>
      ${days.map(d => `<div class="d ${d === t ? "is-today" : ""} ${d === selDay ? "sel" : ""}"><button class="dsel" type="button" data-day="${d}" aria-pressed="${d === selDay}"><span class="wd">${fmtDay(d, { weekday: "short" })}</span><span class="num">${+d.slice(8)}</span><span class="cnt">${count(d) || ""}</span></button>${readOnly ? "" : `<button class="dadd" type="button" data-addday="${d}" aria-label="Add a task on ${esc(fmtDay(d, { weekday: "long", day: "numeric", month: "long" }))}">+</button>`}</div>`).join("")}
      <button class="btn nav" type="button" data-week="7" aria-label="Next week">›</button>
    </div>
    <div class="dayhead">
      <div><h2>${title}, ${fmtDay(selDay, { day: "numeric", month: "long" })}</h2><div class="hint">${left} to do · ${planned.length - left} done</div></div>
      <div class="r">${selDay !== t ? `<button class="btn sm" type="button" data-goto="${t}">Back to today</button>` : ""}<label class="hint" for="t-pick">Go to date</label><input type="date" id="t-pick" value="${selDay}"></div>
    </div>
    <section class="sect"><div class="tlist">${readOnly ? "" : `<form class="trow addrow" id="dayAdd" autocomplete="off"><span class="plus" aria-hidden="true">+</span><input id="dayAddIn" type="text" placeholder="Add a task for ${selDay === t ? "today" : esc(fmtDay(selDay, { weekday: "short", day: "numeric", month: "short" }))}" aria-label="Add a task for this day"><button class="btn sm primary" type="submit">Add</button></form>`}${planned.map(c => rowHTML(c, c.col === "done" ? "" : `<button class="btn sm" type="button" data-shift="${esc(c.id)}" title="Move to the next day">→ ${selDay === t ? "Tomorrow" : "Next day"}</button><button class="btn sm" type="button" data-unplan="${esc(c.id)}" aria-label="Move ${esc(c.title)} off this day" title="Take off this day (keeps the task)">Later</button>`)).join("") || `<div class="tempty">Nothing planned for this day yet. Type a task above, or add one from your board below.</div>`}</div></section>
    ${carried.length ? `<section class="sect"><h3>Not finished from earlier days <button class="btn sm primary" type="button" data-planall="1">Move all to today</button></h3><div class="tlist">${carried.map(c => rowHTML(c, `<button class="btn sm" type="button" data-plan="${esc(c.id)}">→ Today</button>`)).join("")}</div></section>` : ""}
    ${dueHere.length ? `<section class="sect"><h3>Due this day</h3><div class="tlist">${dueHere.map(c => rowHTML(c, add(c))).join("")}</div></section>` : ""}
    ${others.length ? `<details class="sect" id="pick" ${pickOpen ? "open" : ""}><summary>Add from your board (${others.length})</summary><div class="tlist">${others.map(c => rowHTML(c, add(c))).join("")}</div></details>` : ""}`;
  const inp = $("#dayAddIn");
  if (inp) { inp.value = keepVal; if (keepFocus) inp.focus(); }
}

$("#today").addEventListener("submit", async e => {
  if (e.target.id !== "dayAdd") return;
  e.preventDefault();
  const inp = $("#dayAddIn"), v = inp.value.trim(); inp.value = ""; inp.blur();
  const p = v ? parseQuick(v) : null;
  openCard(null, newPreset({ day: selDay, ...(p ? { title: p.title, board: p.board, urgent: p.urgent, important: p.important, due: p.due } : {}) }));
});

$("#today").addEventListener("toggle", e => { if (e.target.id === "pick") pickOpen = e.target.open; }, true);
$("#today").addEventListener("change", async e => {
  if (e.target.id === "t-pick") { if (e.target.value) { selDay = e.target.value; render(); } return; }
  const id = e.target.dataset.done; if (!id || readOnly) return;
  const c = cards.find(x => x.id === id); if (!c) return;
  if (e.target.checked) { c.prevCol = c.col; c.col = "done"; c.doneAt = new Date().toISOString(); }
  else { c.col = c.prevCol && c.prevCol !== "done" ? c.prevCol : (config.columns.find(x => x.id === "next") || config.columns[0]).id; delete c.doneAt; }
  render(); await saveCard(c);
  if (e.target.checked) await spawnNext(c);
});
$("#today").addEventListener("click", async e => {
  const el = e.target.closest("[data-del],[data-day],[data-addday],[data-week],[data-goto],[data-open],[data-plan],[data-unplan],[data-shift],[data-planall]"); if (!el) return;
  if (el.dataset.day) { selDay = el.dataset.day; return render(); }
  if (el.dataset.addday) { selDay = el.dataset.addday; render(); return openCard(null, newPreset({ day: selDay })); }
  if (el.dataset.week) { selDay = addDays(selDay, +el.dataset.week); return render(); }
  if (el.dataset.goto) { selDay = el.dataset.goto; return render(); }
  if (el.dataset.open) return openCard(el.dataset.open);
  if (el.dataset.del) return deleteTasks([el.dataset.del]);
  if (readOnly) return;
  if (el.dataset.planall) { const t = todayIso(), list = cards.filter(c => c.col !== "done" && c.day && c.day < t); list.forEach(c => planOn(c, t)); render(); toast(`Moved ${list.length} to today`); for (const c of list) await saveCard(c); return; }
  const c = cards.find(x => x.id === (el.dataset.plan || el.dataset.unplan || el.dataset.shift)); if (!c) return;
  if (el.dataset.shift) { planOn(c, addDays(c.day || selDay, 1)); toast("Moved to " + fmtDay(c.day, { weekday: "short", day: "numeric", month: "short" })); render(); return saveCard(c); }
  if (el.dataset.plan) { c.day = selDay; c.dayOrder = Math.max(0, ...cards.filter(x => x.day === selDay).map(x => x.dayOrder ?? 0)) + 1; toast("Added to " + (selDay === todayIso() ? "today" : fmtDay(selDay, { weekday: "short", day: "numeric", month: "short" }))); }
  else { c.day = null; }
  render(); await saveCard(c);
});

function cardHTML(c) {
  const b = boardOf(c.board), d = dueInfo(c.due);
  return `<button class="card" draggable="${!readOnly}" data-id="${esc(c.id)}">
    <span class="ctop"><span class="t">${esc(c.title)}</span>${readOnly || c.col === "done" ? "" : `<span class="card-day ${c.day === todayIso() ? "on" : ""}" role="button" tabindex="0" data-today="${esc(c.id)}" title="${c.day === todayIso() ? "On today's list (tap to take off)" : "Put on today's list"}">${c.day === todayIso() ? "✓ Today" : "+ Today"}</span>`}${readOnly ? "" : `<span class="card-del" role="button" tabindex="0" data-del="${esc(c.id)}" aria-label="Delete ${esc(c.title)}" title="Delete">${TRASH}</span>`}</span>
    <span class="meta">
      ${filter === "all" ? `<span class="tag"><span class="dot" style="background:${esc(b.color)}"></span>${esc(b.name)}</span>` : ""}
      ${view === "matrix" ? `<span class="tag">${esc(config.columns.find(x => x.id === c.col)?.name || "")}</span>` : ""}
      ${c.urgent && view !== "matrix" ? `<span class="pill urgent">Urgent</span>` : ""}
      ${c.important && view !== "matrix" ? `<span class="pill important">Important</span>` : ""}
      ${d ? `<span class="pill ${d.cls}">${esc(d.label)}</span>` : ""}
      ${c.day && c.day !== todayIso() && c.col !== "done" ? `<span class="pill planned">${esc(fmtDay(c.day, { weekday: "short", day: "numeric", month: "short" }))}</span>` : ""}
      ${c.repeat ? `<span class="tag">↻ ${repeatName(c.repeat)}</span>` : ""}${clCount(c)}
      ${c.note ? `<span class="note-ic" title="Has notes">≡</span>` : ""}
    </span></button>`;
}

async function save(id, data) {
  if (!db) return toast("Saving isn't available in this view.");
  try { await db.collection("cards").doc(id).set(data); }
  catch (e) { if (e.code === "invalid_argument") { readOnly = true; $("#newTask").hidden = true; render(); $("#state").innerHTML = "<strong>This claude.ai account can view the board but not save to it.</strong><br>Check you're signed in to claude.ai with your own account, then reload."; $("#state").hidden = false; } else if (e.code === "quota_exceeded") toast("The board is full. Delete some done cards to add more."); else toast("Couldn't save. Try again."); }
}
async function saveConfig() {
  if (!db) return;
  try { await db.doc("config/main").set(config); } catch (e) { toast("Couldn't save boards. Try again."); }
}

async function addTask(text) {
  if (!text.trim() || readOnly) return false;
  const p = parseQuick(text); if (!p.title) return false;
  const first = view === "today" ? (config.columns.find(x => x.id === "next") || config.columns[0]).id : config.columns[0].id;
  const minOrder = Math.min(0, ...cards.filter(c => c.col === first).map(c => c.order ?? 0));
  const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const card = { title: p.title, board: p.board, col: first, order: minOrder - 1, urgent: p.urgent, important: p.important, due: p.due, note: "", created: new Date().toISOString() };
  if (view === "today") { card.day = selDay; card.dayOrder = Math.max(0, ...cards.filter(x => x.day === selDay).map(x => x.dayOrder ?? 0)) + 1; }
  cards.push({ id, ...card }); render();
  toast(`Added to ${boardOf(p.board).name}`);
  await save(id, card);
  return true;
}

document.addEventListener("keydown", e => {
  if (e.key === "/" && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) { e.preventDefault(); if (!readOnly && db) $("#newTask").click(); }
  if (e.key === "Escape") closeSheet();
});

$("#chips").addEventListener("click", e => {
  if (e.target.closest("#editBoards")) return openBoardsEditor();
  const v = e.target.closest("[data-v]");
  if (v) { view = v.dataset.v; try { localStorage.setItem("kb.view", view); } catch (er) {} return render(); }
  const c = e.target.closest("[data-f]"); if (!c) return;
  filter = c.dataset.f; try { localStorage.setItem("kb.filter", filter); } catch (er) {}
  render();
});

// Drag and drop between columns (desktop). On phones, tap a card and pick its column.
let dragId = null;
$("#board").addEventListener("dragstart", e => { const c = e.target.closest(".card"); if (!c) return; dragId = c.dataset.id; c.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
$("#board").addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".dragging,.over").forEach(el => el.classList.remove("dragging", "over")); });
$("#board").addEventListener("dragover", e => { const col = e.target.closest(".column"); if (!col || !dragId) return; e.preventDefault(); document.querySelectorAll(".over").forEach(el => el !== col && el.classList.remove("over")); col.classList.add("over"); });
$("#board").addEventListener("drop", async e => {
  const col = e.target.closest(".column"); if (!col || !dragId) return; e.preventDefault();
  const card = cards.find(c => c.id === dragId); if (!card) return;
  const siblings = [...col.querySelectorAll(".card")].filter(el => el.dataset.id !== dragId);
  const after = siblings.find(el => { const r = el.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
  const orderOf = el => cards.find(c => c.id === el.dataset.id)?.order ?? 0;
  let order;
  if (!siblings.length) order = 0;
  else if (!after) order = orderOf(siblings[siblings.length - 1]) + 1;
  else { const i = siblings.indexOf(after); order = i === 0 ? orderOf(after) - 1 : (orderOf(siblings[i - 1]) + orderOf(after)) / 2; }
  const before = card.col;
  if (col.dataset.q) { const q = QUADS.find(x => x.id === col.dataset.q); card.urgent = q.u; card.important = q.i; }
  else card.col = col.dataset.col;
  const doneNow = before !== "done" && card.col === "done"; if (doneNow) card.prevCol = before;
  card.order = order; render();
  const { id, ...data } = card; await save(id, data);
  if (doneNow) await spawnNext(card);
});

$("#board").addEventListener("click", async e => {
  const td = e.target.closest("[data-today]");
  if (td) { e.stopPropagation(); const c = cards.find(x => x.id === td.dataset.today); if (!c) return; const t = todayIso();
    if (c.day === t) { c.day = null; toast("Taken off today"); } else { planOn(c, t); toast("Added to today"); }
    render(); return saveCard(c); }
  const dl = e.target.closest("[data-del]"); if (dl) { e.stopPropagation(); return deleteTasks([dl.dataset.del]); }
  if (e.target.closest("[data-cleardone]")) return deleteTasks(cards.filter(c => c.col === "done" && (filter === "all" || c.board === filter)).map(c => c.id));
  const nc = e.target.closest("[data-newcol]"); if (nc) return openCard(null, newPreset({ col: nc.dataset.newcol }));
  const c = e.target.closest(".card"); if (c) openCard(c.dataset.id);
});
$("#newTask").onclick = () => openCard(null, newPreset(view === "today" ? { day: selDay } : { col: config.columns[0].id }));

function openSheet(html) { const bg = $("#sheetBg"); bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`; bg.hidden = false; }
function closeSheet() { $("#sheetBg").hidden = true; $("#sheetBg").innerHTML = ""; }
$("#sheetBg").addEventListener("click", e => { if (e.target.id === "sheetBg") closeSheet(); });

// Opens the task form. With an id it edits that task; with a preset object it creates a new one.
function openCard(id, preset) {
  const isNew = !id;
  const c = isNew ? { title: "", board: config.boards[0]?.id, col: config.columns[0].id, urgent: false, important: false, due: null, day: null, note: "", checklist: [], ...preset } : cards.find(x => x.id === id);
  if (!c) return;
  const dis = readOnly ? "disabled" : "";
  const seg = (gid, list, cur) => `<div class="seg" id="${gid}">${list.map(o => `<button type="button" class="btn" data-v="${esc(o.id)}" aria-pressed="${cur === o.id}" ${dis}>${o.color ? `<span class="dot" style="background:${esc(o.color)};display:inline-block;margin-right:6px"></span>` : ""}${esc(o.name)}</button>`).join("")}</div>`;
  openSheet(`
    <h3>${isNew ? "New task" : "Edit task"}</h3>
    <div class="field"><label for="f-title">What needs doing?</label><input id="f-title" type="text" value="${esc(c.title)}" placeholder="e.g. Send quote to client" ${dis}></div>
    <div class="field"><label>Where does it go?</label>${seg("f-board", config.boards, c.board)}</div>
    <div class="field"><label>Column</label>${seg("f-col", config.columns, c.col)}</div>
    <div class="row2">
      <div class="field"><label for="f-day">On my day list for</label><input id="f-day" type="date" value="${esc(c.day || "")}" ${dis}>
        ${readOnly ? "" : `<div class="seg"><button class="btn sm" type="button" id="f-day-today">Today</button><button class="btn sm" type="button" id="f-day-tmr">Tomorrow</button><button class="btn sm" type="button" id="f-day-clear">None</button></div>`}</div>
      <div class="field"><label for="f-time">Time (optional)</label><div class="seg"><input id="f-time" type="time" value="${esc(c.time || "")}" aria-label="Start time" ${dis}><span class="hint">to</span><input id="f-end" type="time" value="${esc(c.endTime || "")}" aria-label="End time" ${dis}></div><span class="hint">With a time it goes on Google Calendar. Without one it's an all-day task in Google Tasks.</span></div>
      <div class="field"><label for="f-due">Due date</label><input id="f-due" type="date" value="${esc(c.due || "")}" ${dis}><span class="hint">On your calendar, with emails 14, 7, 3, 2 and 1 days before</span></div>
    </div>
    <div class="field"><label>Repeat <span class="hint">(the next one appears when you tick this off)</span></label>${seg("f-rep", REPEATS, c.repeat || "")}</div>
    <div style="display:flex;gap:18px;flex-wrap:wrap">
      <label class="hint" style="display:flex;gap:8px;align-items:center"><input id="f-urgent" type="checkbox" ${c.urgent ? "checked" : ""} ${dis}> Urgent</label>
      <label class="hint" style="display:flex;gap:8px;align-items:center"><input id="f-important" type="checkbox" ${c.important ? "checked" : ""} ${dis}> Important</label>
    </div>
    <div class="field"><label>Checklist <span id="cl-sum"></span></label>
      <div class="cl-bar" id="cl-bar"><i></i></div>
      <div class="cl" id="f-cl"></div>
      ${readOnly ? "" : `<form class="cl-add" id="cl-form" autocomplete="off"><input id="cl-new" type="text" placeholder="Add an item and press Enter" aria-label="New checklist item"><button class="btn" type="submit">Add</button></form>`}
    </div>
    <div class="field"><label for="f-note">Notes</label><textarea id="f-note" rows="3" ${dis}>${esc(c.note || "")}</textarea></div>
    <div class="actions">
      ${readOnly || isNew ? "<span></span>" : `<button class="btn danger" id="f-del" type="button">Delete</button>`}
      <div class="r"><button class="btn" id="f-cancel" type="button">${isNew ? "Cancel" : "Close"}</button>${readOnly ? "" : `<button class="btn primary" id="f-save" type="button">${isNew ? "Add task" : "Save"}</button>`}</div>
    </div>`);
  let col = c.col, board = c.board, repeat = c.repeat || "";
  let items = (c.checklist || []).map(i => ({ ...i }));
  // On an existing task, checklist changes save straight away so ticking items needs no Save tap.
  const drawCl = () => {
    const done = items.filter(i => i.done).length;
    $("#cl-sum").textContent = items.length ? `· ${done} of ${items.length} done` : "";
    $("#cl-bar").hidden = !items.length;
    $("#cl-bar i").style.width = items.length ? (done / items.length * 100) + "%" : "0";
    $("#f-cl").innerHTML = items.map((it, i) => `<label class="cl-item ${it.done ? "done" : ""}"><input type="checkbox" data-i="${i}" ${it.done ? "checked" : ""} ${dis}><span>${esc(it.t)}</span>${readOnly ? "" : `<button class="x" type="button" data-rm="${i}" aria-label="Remove item">✕</button>`}</label>`).join("") || `<div class="hint">No items yet.</div>`;
  };
  const saveCl = async () => {
    drawCl();
    if (isNew) return;
    c.checklist = items.map(i => ({ ...i })); render();
    const cur = cards.find(x => x.id === c.id) || c;
    cur.checklist = c.checklist;
    await saveCard(cur);
  };
  drawCl();
  $("#f-cl").addEventListener("change", e => { const i = e.target.dataset.i; if (i == null || readOnly) return; items[i].done = e.target.checked; saveCl(); });
  $("#f-cl").addEventListener("click", e => { const r = e.target.closest("[data-rm]"); if (!r) return; e.preventDefault(); items.splice(+r.dataset.rm, 1); saveCl(); });
  $("#cl-form")?.addEventListener("submit", e => { e.preventDefault(); const inp = $("#cl-new"); const t = inp.value.trim(); if (!t) return; items.push({ t, done: false }); inp.value = ""; saveCl(); inp.focus(); });
  const pick = (gid, set) => $(gid).addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (!b || readOnly) return; set(b.dataset.v); $(gid).querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); });
  pick("#f-col", v => col = v);
  pick("#f-board", v => board = v);
  pick("#f-rep", v => repeat = v);
  $("#f-cancel").onclick = closeSheet;
  if (readOnly) return;
  if (isNew) setTimeout(() => $("#f-title")?.focus(), 30);
  $("#f-day-today").onclick = () => { $("#f-day").value = todayIso(); };
  $("#f-day-tmr").onclick = () => { $("#f-day").value = addDays(todayIso(), 1); };
  $("#f-day-clear").onclick = () => { $("#f-day").value = ""; };
  $("#f-title").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); $("#f-save").click(); } });
  $("#f-save").onclick = async () => {
    const title = $("#f-title").value.trim() || c.title;
    if (!title) { $("#f-title").focus(); return toast("Give the task a name first."); }
    const before = c.col;
    if (isNew || col !== c.col) c.order = Math.min(0, ...cards.filter(x => x.col === col).map(x => x.order ?? 0)) - 1;
    const time = $("#f-time").value || null; let endTime = time ? ($("#f-end").value || null) : null; if (endTime && endTime <= time) endTime = null;
    Object.assign(c, { title, col, board, time, endTime, due: $("#f-due").value || null, urgent: $("#f-urgent").checked, important: $("#f-important").checked, note: $("#f-note").value, checklist: items.map(i => ({ ...i })), repeat: repeat || null });
    if (!repeat) delete c.repeatSpawned;
    const day = $("#f-day").value || null;
    if (isNew || day !== (c.day || null)) { c.day = day; if (day) c.dayOrder = Math.max(0, ...cards.filter(x => x.day === day && x !== c).map(x => x.dayOrder ?? 0)) + 1; }
    if (c.repeat && !c.day) { c.day = todayIso(); c.dayOrder = Math.max(0, ...cards.filter(x => x.day === c.day && x !== c).map(x => x.dayOrder ?? 0)) + 1; }
    const doneNow = !isNew && before !== "done" && c.col === "done"; if (doneNow) c.prevCol = before;
    if (isNew) { c.id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); c.created = new Date().toISOString(); cards.push(c); }
    closeSheet(); render();
    if (isNew) toast(`Added to ${boardOf(board).name}`);
    await saveCard(c);
    if (doneNow) await spawnNext(c);
  };
  const del = $("#f-del");
  if (del) del.onclick = () => {
    closeSheet(); deleteTasks([c.id]);
  };
}

function openBoardsEditor() {
  const draft = JSON.parse(JSON.stringify(config));
  const draw = () => openSheet(`
    <h3>Boards and columns</h3>
    <div class="field"><label>Boards (Life and each business)</label><div class="list" id="bl">${draft.boards.map((b, i) => `
      <div class="item"><input type="color" value="${esc(b.color)}" data-i="${i}" data-k="color" aria-label="Colour for ${esc(b.name)}"><input type="text" value="${esc(b.name)}" data-i="${i}" data-k="name" aria-label="Board name"><button class="btn" type="button" data-rm="${i}" aria-label="Remove ${esc(b.name)}">✕</button></div>`).join("")}</div>
      <button class="btn" type="button" id="addB">Add board</button></div>
    <div class="field"><label>Columns, left to right</label><div class="list" id="cl">${draft.columns.map((c, i) => `
      <div class="item"><input type="text" value="${esc(c.name)}" data-ci="${i}" aria-label="Column name"><button class="btn" type="button" data-crm="${i}" aria-label="Remove ${esc(c.name)}">✕</button></div>`).join("")}</div>
      <button class="btn" type="button" id="addC">Add column</button></div>
    <div class="hint">Cards on a removed board or column are kept and show up under All or in the first column.</div>
    <div class="actions"><span></span><div class="r"><button class="btn" id="bx" type="button">Cancel</button><button class="btn primary" id="bs" type="button">Save</button></div></div>`);
  const bind = () => {
    $("#bl").oninput = e => { const t = e.target; if (t.dataset.i != null) draft.boards[t.dataset.i][t.dataset.k] = t.value; };
    $("#cl").oninput = e => { const t = e.target; if (t.dataset.ci != null) draft.columns[t.dataset.ci].name = t.value; };
    $("#bl").onclick = e => { const r = e.target.closest("[data-rm]"); if (r && draft.boards.length > 1) { draft.boards.splice(+r.dataset.rm, 1); draw(); bind(); } };
    $("#cl").onclick = e => { const r = e.target.closest("[data-crm]"); if (r && draft.columns.length > 1) { draft.columns.splice(+r.dataset.crm, 1); draw(); bind(); } };
    $("#addB").onclick = () => { draft.boards.push({ id: "", name: "New business", color: "#7a5aa8" }); draw(); bind(); };
    $("#addC").onclick = () => { draft.columns.push({ id: "", name: "New column" }); draw(); bind(); };
    $("#bx").onclick = closeSheet;
    $("#bs").onclick = async () => {
      const used = new Set();
      const fix = (arr) => arr.forEach(x => { x.name = x.name.trim() || "Untitled"; if (!x.id) { let s = slug(x.name), k = s, n = 2; while (used.has(k) || arr.some(y => y !== x && y.id === k)) k = s + "-" + n++; x.id = k; } used.add(x.id); });
      fix(draft.boards); used.clear(); fix(draft.columns);
      config = draft; if (filter !== "all" && !config.boards.some(b => b.id === filter)) filter = "all";
      closeSheet(); render(); await saveConfig(); toast("Boards saved");
    };
  };
  draw(); bind();
}

function show() { if (!readOnly) $("#state").hidden = true; loaded = true; render(); }

// ---- Supabase storage, shaped like the small db API the board was written against ----
const SB = window.supabase && window.KANBAN_CONFIG?.url ? window.supabase.createClient(KANBAN_CONFIG.url, KANBAN_CONFIG.anonKey, { auth: { persistSession: true, autoRefreshToken: true } }) : null;
function makeDb(userId) {
  const subs = { cards: new Set(), config: new Set() };
  let cache = new Map(), configDoc = null;
  const emitCards = () => { const docs = [...cache].map(([id, d]) => ({ id, data: () => d })); subs.cards.forEach(fn => fn({ docs })); };
  const emitConfig = () => subs.config.forEach(fn => fn({ exists: !!configDoc, data: () => configDoc }));
  const fail = error => { throw { code: "unavailable", message: error.message }; };
  async function loadCards() { const { data, error } = await SB.from("cards").select("id, doc"); if (error) return; cache = new Map(data.map(r => [r.id, r.doc])); emitCards(); }
  async function loadConfig() { const { data } = await SB.from("config").select("doc").eq("id", "main").maybeSingle(); configDoc = data?.doc || null; emitConfig(); }
  SB.channel("kanban-" + userId)
    .on("postgres_changes", { event: "*", schema: "public", table: "cards" }, p => { if (p.eventType === "DELETE") cache.delete(p.old.id); else cache.set(p.new.id, p.new.doc); emitCards(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "config" }, p => { if (p.new?.doc) { configDoc = p.new.doc; emitConfig(); } })
    .subscribe();
  // Phones pause background tabs, so catch up whenever the app comes back to the front.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadCards(); loadConfig(); } });
  return {
    collection: () => ({
      onSnapshot(fn) { subs.cards.add(fn); loadCards(); return () => subs.cards.delete(fn); },
      doc: id => ({
        async set(d) { cache.set(id, d); const { error } = await SB.from("cards").upsert({ id, user_id: userId, doc: d, updated_at: new Date().toISOString() }); if (error) fail(error); },
        async delete() { cache.delete(id); const { error } = await SB.from("cards").delete().eq("id", id); if (error) fail(error); }
      })
    }),
    doc: () => ({
      onSnapshot(fn) { subs.config.add(fn); loadConfig(); return () => subs.config.delete(fn); },
      async set(d) { configDoc = d; const { error } = await SB.from("config").upsert({ id: "main", user_id: userId, doc: d }); if (error) fail(error); }
    })
  };
}

function start(user) {
  readOnly = false;
  db = makeDb(user.id);
  $("#sub").textContent = user.email || "";
  $("#signOut").hidden = false; $("#newTask").hidden = false; $("#newTask").disabled = false;
  $("#state").textContent = "Loading your board…"; $("#state").hidden = false;
  db.doc("config/main").onSnapshot(s => { if (s.exists) { const d = s.data(); if (d.boards?.length && d.columns?.length) config = JSON.parse(JSON.stringify(d)); } show(); });
  db.collection("cards").onSnapshot(snap => { cards = snap.docs.map(d => ({ id: d.id, ...d.data() })); show(); });
}

function showLogin(msg) {
  $("#newTask").hidden = true; $("#signOut").hidden = true; $("#board").hidden = true; $("#today").hidden = true;
  $("#state").hidden = false;
  $("#state").innerHTML = `<form class="login" id="login" autocomplete="on">
    <h2>Sign in</h2>
    <input id="lg-email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="lg-pass" type="password" placeholder="Password" autocomplete="current-password" required minlength="6">
    <button class="btn primary" type="submit">Sign in</button>
    <button class="btn" type="button" id="lg-signup">First time? Create your account</button>
    <p class="hint" id="lg-msg">${esc(msg || "")}</p>
  </form>`;
  const go = async signup => {
    const email = $("#lg-email").value.trim(), password = $("#lg-pass").value;
    if (!email || password.length < 6) return ($("#lg-msg").textContent = "Enter your email and a password of at least 6 characters.");
    $("#lg-msg").textContent = signup ? "Creating your account…" : "Signing in…";
    const { data, error } = signup ? await SB.auth.signUp({ email, password }) : await SB.auth.signInWithPassword({ email, password });
    if (error) return ($("#lg-msg").textContent = error.message);
    if (data.session) start(data.session.user);
    else $("#lg-msg").textContent = "Check your email to confirm the account, then sign in here.";
  };
  $("#login").addEventListener("submit", e => { e.preventDefault(); go(false); });
  $("#lg-signup").onclick = () => go(true);
}

$("#signOut").onclick = async () => { await SB.auth.signOut(); location.reload(); };

(async () => {
  if (!SB) { $("#state").textContent = "Setup needed: add your Supabase details to config.js."; return; }
  const { data: { session } } = await SB.auth.getSession();
  if (session) start(session.user); else showLogin();
})();
</script>
